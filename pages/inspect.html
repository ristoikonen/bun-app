<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locale Selector</title>
    <style>
        body {
            background-color: #0d1117;
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #161b22;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid #30363d;
            width: 380px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #c9d1d9;
        }

        .grid-cols-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .locale-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 4px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .locale-btn:hover {
            background: #30363d;
            border-color: #8b949e;
            color: #ffffff;
        }

        input[type="text"] {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #f0f6fc;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 3px rgba(88, 166, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Locale Field -->
        <div>
            <label for="localeInput">Locale Preset / Custom</label>
            <div class="grid-cols-4" style="margin-bottom: 0.75rem;">
                <button type="button" onclick="setLocale('Palm')" class="locale-btn">Palm</button>
                <button type="button" onclick="setLocale('Crace')" class="locale-btn">Crace</button>
                <button type="button" onclick="setLocale('Kaleen')" class="locale-btn">Kaleen</button>
                <button type="button" onclick="setLocale('Gira')" class="locale-btn">Gira</button>
                <button type="button" onclick="setLocale('Gungahlin')" class="locale-btn">Gung</button>
                <button type="button" onclick="setLocale('Franklin')" class="locale-btn">Franklin</button>
                <button type="button" onclick="setLocale('Harrison')" class="locale-btn">Harrison</button>
                <button type="button" onclick="setLocale('Belconnen')" class="locale-btn">Belco</button>
            </div>
            <input type="text" id="localeInput" value="Palm" placeholder="Select preset or type custom locale...">
        </div>
    </div>

    <script>
        function setLocale(val) {
            document.getElementById('localeInput').value = val;
        }
    </script>
</body>
</html>
